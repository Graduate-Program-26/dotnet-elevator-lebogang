name: Build and Test

on:
  push:
    branches: [ main, development ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore ./dotnet_elevator_lebogang.slnx

      - name: Build
        run: dotnet build ./dotnet_elevator_lebogang.slnx --no-restore --configuration Release

      - name: Test
        run: dotnet test ./dotnet_elevator_lebogang.slnx --no-build --configuration Release
          --verbosity normal --logger "trx"

      - name: Publish test results
        uses: dorny/test-reporter@v1
        if: always()
        with:
          name: xUnit Tests
          path: '**/*.trx'
          reporter: dotnet-trx